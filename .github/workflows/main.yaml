name: Python CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.5"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_CACHE_DIR: "/home/runner/.cache/poetry"
  DBT_PROJECT_DIR: "${{ github.workspace }}/dbt/minc"

  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/govhub-br/data-application-minc-airflow
  IMAGE_TAG_SHA: ${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-poetry
        with:
          python_version: ${{ env.PYTHON_VERSION }}
          poetry_version: ${{ env.POETRY_VERSION }}
          poetry_cache_dir: ${{ env.POETRY_CACHE_DIR }}

      - name: Run lint
        run: poetry run make lint-ci || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-poetry
        with:
          python_version: ${{ env.PYTHON_VERSION }}
          poetry_version: ${{ env.POETRY_VERSION }}
          poetry_cache_dir: ${{ env.POETRY_CACHE_DIR }}

      - name: Run tests
        run: >
          poetry run pytest tests
          --junitxml=report.xml
          --cov=. --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            report.xml
            coverage.xml

  docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build Airflow
        uses: docker/build-push-action@v5
        with:
          push: false
          context: .
          file: ./infra/docker/airflow/Dockerfile
          target: airflow-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_SHA }}

  docker_push:
    name: Docker push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker_build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Airflow
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: ./infra/docker/airflow/Dockerfile
          target: airflow-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_SHA }}
            ${{ env.IMAGE_NAME }}:latest
