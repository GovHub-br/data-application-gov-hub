name: Docker build
description: Builds the project image with GHA layer caching, optionally logging in to a registry and pushing.
inputs:
  push:
    description: Whether to push the built image ("true"/"false")
    required: true
    default: "false"
  tags:
    description: Newline-separated list of image tags
    required: true
  context:
    description: Build context
    required: false
    default: "."
  registry:
    description: Registry to log into before pushing (login step is skipped if empty)
    required: false
    default: ""
  registry_username:
    description: Registry username
    required: false
    default: ""
  registry_password:
    description: Registry password/token
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Login to registry
      if: inputs.registry != ''
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        push: ${{ inputs.push }}
        context: ${{ inputs.context }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: ${{ inputs.tags }}
