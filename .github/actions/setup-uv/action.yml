name: Setup uv
description: Install Python, cache & install deps (dev)
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: ${{ inputs.uv_version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python_version }}
    - name: Install deps
      shell: bash
      run: make install
inputs:
  python_version:
    description: Python version
    required: true
    default: "3.11"
  uv_version:
    description: uv version
    required: true
    default: "0.5.11"
