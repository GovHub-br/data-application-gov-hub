version: 2

models:
  - name: fct_pagamentos_elegiveis
    description: "1 linha por pagamento (payment-first). Flags de cota + tem_perfil + ano_final + anexo_id."
    columns:
      - name: origem_ano
        tests:
          - accepted_values: {values: ['nome_edital', 'anexo_edital', 'nome_arquivo', 'sem_ano']}
  # fct_pagamentos_bbagil e comparativo_recebido_vs_pago estão enabled=false
  # (aguardam a extração bbágil gerar bsc_pnab.fato_bbagil) — reativar aqui depois.
  - name: cobertura_pagamentos
    description: "Cobertura por ano — teto de confiabilidade das cotas (valor casado + temporal)."
  - name: distribuicao_cotas_lpg
    description: "Cotas SOMENTE LPG (valor ponderado): negra 25%, indígena 10%, PCD 5%, território vulnerabilizado 20%; veredito vs meta."
    columns:
      - name: grupo
        tests:
          - accepted_values: {values: ['negra', 'indigena', 'pcd', 'territorio_vulneravel']}
      - name: status_sobre_com_perfil
        tests:
          - accepted_values: {values: ['alcancada', 'descumprida']}
  - name: distribuicao_cotas_pnab
    description: "Cotas SOMENTE PNAB (valor ponderado): negra 25%, indígena 10%, PCD 5% (sem território); veredito vs meta."
    columns:
      - name: grupo
        tests:
          - accepted_values: {values: ['negra', 'indigena', 'pcd']}
      - name: status_sobre_com_perfil
        tests:
          - accepted_values: {values: ['alcancada', 'descumprida']}
