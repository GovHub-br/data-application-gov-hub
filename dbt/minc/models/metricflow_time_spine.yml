version: 2

models:
  - name: metricflow_time_spine
    description: >
      Time spine do MetricFlow — tabela de calendário exigida pelo dbt Semantic
      Layer em qualquer projeto que declare `semantic_models`/`metrics`, mesmo
      sem métricas temporais. Grão: 1 linha por dia, de 2010 a 2035.
    config:
      # `infraestrutura`: existe para o MetricFlow funcionar, não é dado de
      # negócio — candidata natural a ficar fora do escopo do RAG.
      tags: [infraestrutura, metricflow]
      meta:
        status: Active
    # Configuração YAML do time spine: obrigatória a partir do dbt 1.10 —
    # sem ela o parse emite MFTimespineWithoutYamlConfigurationDeprecation
    # (hoje warning, depreciação em curso).
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: "Data no grão de dia."
        granularity: day
        tests:
          - unique
          - not_null
