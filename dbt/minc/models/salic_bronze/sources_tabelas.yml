version: 2
sources:
  - name: bronze_tabelas
    schema: bronze
    description: >
      Cadastro auxiliar do SALIC: pessoas, endereços, órgãos e domínios de apoio (categorias,
      localidades) usados pelo núcleo SAC. Camada bronze (dados brutos do SALIC, réplica do
      sistema de origem via Airflow, sem tratamento). Descrições e tiers gerados automaticamente
      a partir do dicionário de dados original do SALIC (export SchemaSpy) cruzado com o levantamento
      estatístico do bronze — ver dbt/minc/docs/salic/ para o catálogo completo (YAML semântico,
      dicionário e catálogo em DOCX/HTML).
    tables:
      - name: tabelas__autorizados
        description: >
          Tabela responsável por registrar permissões, operações e códigos autorizados no sistema.
        config:
          tags:
            - bronze
            - salic
            - tabelas
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura
            tags:
              - Certification.Bronze
        columns:
          - name: aut_identificacao
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(11).
            data_type: text
            tests:
              - not_null
          - name: aut_procedure
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(30).
            data_type: text
            tests:
