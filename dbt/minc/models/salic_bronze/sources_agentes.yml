version: 2
sources:
  - name: bronze_agentes
    schema: bronze
    description: >
      Registro de identidade de agentes (pessoas físicas e jurídicas), compartilhado com outros
      domínios do MinC além do SALIC (ex.: LPG, PNAB). Camada bronze (dados brutos do SALIC,
      réplica do sistema de origem via Airflow, sem tratamento). Descrições e tiers gerados
      automaticamente a partir do dicionário de dados original do SALIC (export SchemaSpy) cruzado
      com o levantamento estatístico do bronze — ver dbt/minc/docs/salic/ para o catálogo completo
      (YAML semântico, dicionário e catálogo em DOCX/HTML).
    tables:
      - name: agentes__agentes
        description: >
          Tabela responsável por armazenar dados principais do agente, incluindo identificação,
          tipo de pessoa, datas e status cadastral.
        config:
          tags:
            - bronze
            - salic
            - agentes
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura
            tags:
              - Certification.Bronze
        columns:
          - name: idagente
            description: >
              Identificador sequêncial  de cada pessoa. Tipo original (SQL Server): int identity(4).
            data_type: text
            tests:
              - not_null
          - name: cnpjcpf
            description: >
              Armazena o número identificado de pessoa juridica (CNPJ) ou pessoa física (CPF),
              dependendo do cadastro escolhido. Tipo original (SQL Server): varchar(14).
            data_type: text
          - name: cnpjcpfsuperior
            description: >
              Armazena o CPF ou CNPJ da pessoa que é superior, em cargo ou a nível de dependência.
              Tipo original (SQL Server): varchar(14).
            data_type: text
          - name: tipopessoa
            description: >
              Identifica o tipo de pessoa que está cadastrada. 0 - Pessoa  Fisica ou 1- Pessoa
              Juridica Tipo original (SQL Server): bit(1).
            data_type: text
          - name: dtcadastro
            description: >
              Data de cadastro da pessoa. Tipo original (SQL Server): datetime(16,3).
            data_type: text
          - name: dtatualizacao
            description: >
              Data de atualização do resitro da pessoa Tipo original (SQL Server): datetime(16,3).
            data_type: text
          - name: dtvalidade
            description: >
              Data de validade do registro da pessoa. Tipo original (SQL Server): datetime(16,3).
            data_type: text
          - name: status
            description: >
              Status do registro da pessoa, 0 - para ativo e 1 - para inativo Tipo original
              (SQL Server): tinyint(1).
            data_type: text
          - name: usuario
            description: >
              Numero do usuario resposável pelo cadatro do registro no sistema. Tipo original
              (SQL Server): int(4).
            data_type: text
      - name: agentes__bancos
        description: >
          Tabela utilizada para armazenar códigos bancários, CNPJ e descrições de bancos.
        config:
