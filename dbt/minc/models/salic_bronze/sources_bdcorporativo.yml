version: 2
sources:
  - name: bronze_bdcorporativo
    schema: bronze
    description: >
      Metadados técnicos do banco de dados corporativo (ex.: diagramas do SQL Server). Não é
      dado de negócio do SALIC. Camada bronze (dados brutos do SALIC, réplica do sistema de
      origem via Airflow, sem tratamento). Descrições e tiers gerados automaticamente a partir
      do dicionário de dados original do SALIC (export SchemaSpy) cruzado com o levantamento
      estatístico do bronze — ver dbt/minc/docs/salic/ para o catálogo completo (YAML semântico,
      dicionário e catálogo em DOCX/HTML).
    tables:
      - name: bdcorporativo__sysdiagrams
        description: >
          Tabela responsável por armazenar diagramas do SQL Server criados no ambiente.
        config:
          tags:
            - bronze
            - salic
            - bdcorporativo
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura
            tags:
              - Certification.Bronze
        columns:
          - name: name
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): sysname(256).
            data_type: text
          - name: principal_id
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
          - name: diagram_id
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int identity(4).
            data_type: text
            tests:
              - not_null
              - unique
          - name: version
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
          - name: definition
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varbinary(2147483647).
            data_type: text
