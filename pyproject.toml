[project]
name = "lappis"
version = "0.1.0"
description = "Gestão de Dados do IPEA - Aplicações Python"
authors = [{ name = "Lappis UNB" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-airflow==2.8.1",
    "apache-airflow-providers-postgres==5.14.0",
    "apache-airflow-providers-microsoft-mssql==3.7.2",
    "flask-session==0.5.0",
    "numpy==1.26.4",
    "flask",
    "dbt-core==1.12.0",
    "dbt-postgres",
    "pandas",
    "requests",
    "httpx",
    "sqlalchemy",
    "zeep",
    "imap-tools",
    "chardet",
    "astronomer-cosmos",
    "openpyxl>=3.1.5,<4.0.0",
    "polars",
    "pyarrow",
    "s3fs",
    "boto3",
    "adlfs",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "ruff",
    "pytest",
    "pytest-cov",
    "ty",
    "jupyter",
    "moto[s3]",
    "shandy-sqlfmt",
]

[tool.uv]
package = false

[tool.black]
line-length = 90
target-version = ["py311"]
skip-string-normalization = false
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.conda
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "build",
    "dist",
    "*.pyi",
    ".ipynb_checkpoints",
    "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: requires a live MinIO instance (docker-compose up)",
    "unit: pure unit tests with no external dependencies",
]

[tool.coverage.run]
source = ["airflow_lappis/plugins", "airflow_lappis/helpers"]

[tool.coverage.report]
show_missing = true
skip_empty = true
pythonpath = ["airflow_lappis", "airflow_lappis/helpers", "airflow_lappis/plugins"]

[tool.sqlfmt]
line_length = 120
dialect = "polyglot"
exclude = [
    ".git/",
    ".venv/",
    "build/",
    "dist/",
    "**/target/**",
    "**/compiled/**"
]

