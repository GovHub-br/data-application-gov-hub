[tool.poetry]
package-mode = false
name = "lappis"
version = "0.1.0"
description = "Gestão de Dados do IPEA - Aplicações Python"
authors = ["Lappis UNB"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.11"
apache-airflow = "2.8.1"
apache-airflow-providers-postgres = "5.14.0"
apache-airflow-providers-microsoft-mssql = "3.7.2"
flask-session = "0.5.0"
numpy = "1.26.4"
flask = "*"
dbt-core = "*"
dbt-postgres = "*"
dbt-duckdb = "*"
pandas = "*"
requests = "*"
sqlalchemy = "*"
zeep = "*"
imap-tools = "*"
astronomer-cosmos = "*"
openpyxl = "^3.1.5"
polars = "*"
pyarrow = "*"
s3fs = "*"
boto3 = "*"
adlfs = "*"

[tool.poetry.group.dev.dependencies]
black = "*"
ruff = "*"
pytest = "*"
pytest-cov = "*"
ty = "*"
jupyter = "*"
moto = {version = "*", extras = ["s3"]}
shandy-sqlfmt = "*"
sqlfluff = "*"
sqlfluff-templater-dbt = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 90
target-version = ["py311"]
skip-string-normalization = false
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.conda
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 90
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "build",
    "dist",
    "*.pyi",
    ".ipynb_checkpoints",
    "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["C901"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: requires a live MinIO instance (docker-compose up)",
    "unit: pure unit tests with no external dependencies",
]

[tool.sqlfmt]
line_length = 90
dialect = "polyglot"
exclude = [
    ".git/",
    ".venv/",
    "build/",
    "dist/",
    "**/target/**",
    "**/compiled/**"
]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "dbt"
max_line_length = 90
exclude_rules = "L016,LT02,LT09,LT14,RF02,AL04,CV08"
verbose = 1

[tool.sqlfluff.indentation]
indented_joins = true
indented_using_on = true
template_blocks_indent = true
indent_unit = "space"
tab_space_size = 2

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "lower"

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.dbt]
project_dir = "./airflow_lappis/dags/dbt/ipea"
profiles_dir = "./airflow_lappis/dags/dbt/ipea"
profile = "ipea"
target = "prod"
defer_mode = true
static_analysis = true
disable_database_connection = true
