version: 2

models:

  - name: empenhos_plano_acao
    description: >
      Esta tabela estabelece a relação entre os empenhos registrados no SIAFI e os respectivos Planos de Ação, 
      permitindo o rastreamento das despesas públicas desde a origem do crédito até sua execução. 
    meta:
      tags:
        - silver
    columns:
    - name: ne
      description: >
        Número da Nota de Empenho, extraído dos 12 últimos dígitos do campo `ne_ccor`, representando o identificador do empenho no SIAFI.
    - name: num_transf
      description: >
        Número da transferência identificado na descrição da nota de empenho (`ne_ccor_descricao`), utilizado para vincular o empenho ao Plano de Ação correspondente.
    - name: nc
      description: >
        Código da Nota de Crédito associado ao empenho, extraído da descrição da nota de empenho e formatado conforme padrão estabelecido.
    - name: plano_acao
      description: >
        Identificador do Plano de Ação relacionado ao empenho, obtido a partir da correspondência com o número de transferência (`num_transf`).
    - name: ne_ccor
      description: >
        Campo original contendo o código completo da Nota de Empenho, utilizado como base para extração de identificadores.
    - name: ne_ccor_descricao
      description: >
        Descrição textual da Nota de Empenho, de onde são extraídos os números de transferência e códigos de nota de crédito para associação com os Planos de Ação.
    - name: demais_colunas
      description: >
        Outras colunas provenientes da tabela `empenhos_tesouro`, contendo informações adicionais sobre os empenhos, como data de emissão, valor, unidade gestora, entre outras.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) mais recente de ingestão dos dados das tabelas fonte utilizadas neste modelo.

  - name: nc_plano_acao
    description: >
      Esta tabela estabelece a relação entre as Notas de Crédito registradas no SIAFI e os respectivos Planos de Ação, 
      permitindo o rastreamento das movimentações financeiras desde a origem do crédito até sua aplicação. 
    meta:
      tags:
        - silver
    columns:
    - name: plano_acao
      description: >
        Identificador do Plano de Ação relacionado à Nota de Crédito, obtido a partir da correspondência com o número de transferência (`nc_transferencia`).
    - name: emissao_dia
      description: >
        Dia de emissão da Nota de Crédito.
    - name: num_transf
      description: >
        Número da transferência associado à Nota de Crédito, utilizado para vincular a movimentação financeira ao Plano de Ação correspondente.
    - name: nc
      description: >
        Código da Nota de Crédito, extraído dos 12 últimos dígitos do campo `nc`, representando o identificador da nota no SIAFI.
    - name: nc_fonte_recursos
      description: >
        Código da fonte de recursos associada à Nota de Crédito, indicando a origem dos recursos utilizados.
    - name: ptres
      description: >
        Código do Plano Interno de Trabalho (PTRES) vinculado à Nota de Crédito, representando a ação orçamentária correspondente.
    - name: ug_emitente
      description: >
        Código da Unidade Gestora emitente da Nota de Crédito, extraído dos 6 primeiros dígitos do campo `nc`.
    - name: nc_natureza_despesa
      description: >
        Código da natureza da despesa associada à Nota de Crédito, conforme classificação orçamentária.
    - name: nc_evento
      description: >
        Código do evento contábil associado à Nota de Crédito, representando a natureza da transação.
    - name: nc_evento_descr
      description: >
        Descrição do evento contábil vinculado à Nota de Crédito.
    - name: nc_valor
      description: >
        Valor monetário da Nota de Crédito, ajustado conforme o tipo de evento contábil.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) mais recente de ingestão dos dados das tabelas fonte utilizadas neste modelo.

  - name: pf_plano_acao
    description: >
      Esta tabela consolida as programações financeiras executadas no âmbito do SIAFI que estão relacionadas a Planos de Ação.
    meta:
      tags:
        - silver
    columns:
    - name: pf
      description: >
        Número identificador da Programação Financeira, conforme registrado no SIAFI.
    - name: num_transf
      description: >
        Número da transferência extraído do campo `pf_inscricao`, utilizado como chave alternativa para vinculação com Planos de Ação.
    - name: emissao_mes
      description: >
        Mês da emissão da Programação Financeira, no formato numérico (1 a 12).
    - name: emissao_dia
      description: >
        Dia da emissão da Programação Financeira, no formato numérico (1 a 31).
    - name: ug_emitente
      description: >
        Código da Unidade Gestora responsável pela emissão da Programação Financeira.
    - name: ug_favorecido
      description: >
        Código da Unidade Gestora favorecida pela Programação Financeira.
    - name: pf_evento
      description: >
        Código do evento contábil associado à Programação Financeira, que descreve o tipo de movimentação registrada.
    - name: pf_evento_descricao
      description: >
        Descrição do evento contábil da Programação Financeira, fornecendo contexto adicional sobre o tipo de operação realizada.
    - name: pf_acao
      description: >
        Código da ação orçamentária extraído da descrição da programação financeira, representando a finalidade da despesa.
    - name: pf_valor_linha
      description: >
        Valor programado para execução financeira, referente à linha específica da Programação Financeira.
    - name: plano_acao
      description: >
        Identificador do Plano de Ação associado à Programação Financeira, determinado por correspondência direta com o sistema TransfereGov ou via número de transferência.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) mais recente de ingestão dos dados das tabelas fonte utilizadas neste modelo.

  - name: bolsistas_nc_tesouro
    description: >
      Liga cada pagamento de bolsa por bolsista (pagamentos_ob_bolsa) ao número de transferência (TED) de
      origem, usando bolsas_pagas como ponte e nc_tesouro como destino. O grão é a linha de pagamento
      (ob, oblc_sequencial) — preserva o mesmo bolsista que recebe em vários meses/OBs. Join 1:
      pagamentos_ob_bolsa.ob = bolsas_pagas.item_informacao (traz a fonte de recurso e o ptres da bolsa).
      Join 2: (fonte_recursos_codigo, ptres) = (nc_tesouro.nc_fonte_recursos, ptres), apenas notas de
      crédito que são transferências reais (nc_transferencia não em '-8'/'-9'). Quando (fonte, ptres)
      aponta para um único TED, num_transferencia é preenchido. Quando a fonte é compartilhada por vários
      TEDs (ex.: o mesmo TED em tranches/anos diferentes, ou a fonte genérica '1000000000'), o vínculo é
      ambíguo e num_transferencia fica EM BRANCO — não há como desambiguar automaticamente (a observação
      do pagamento cita o nome do TED, mas nunca o número da transferência; só análise manual resolveria).
      Todos os pagamentos são mantidos (LEFT JOIN); qtd_transferencia indica o motivo do branco:
      0 = sem TED, >= 2 = ambíguo. É um modelo largo (silver): além do vínculo do TED, carrega o detalhe
      do pagamento/bolsista, dados bancários, a classificação orçamentária da bolsa (fonte, ptres,
      natureza, PI, empenhos) e um resumo do TED resolvido; a curadoria final de campos é feita na gold.
    meta:
      tags:
        - silver
    columns:
    - name: ob
      description: >
        Número da Ordem Bancária que pagou o bolsista.
      tests:
        - not_null
    - name: oblc_sequencial
      description: >
        Sequencial do bolsista dentro da OB/LC. Com ob forma a chave da linha de pagamento (grão).
    - name: ob_lista_credores
      description: >
        Número da Lista de Credores (LC) associada à OB.
    - name: documento_habil
      description: >
        Documento hábil do pagamento (ex.: NP) registrado em pagamentos_ob_bolsa.
    - name: dh_mes_emissao
      description: >
        Mês de emissão do documento de pagamento.
    - name: dh_dia_emissao
      description: >
        Data de emissão do documento de pagamento.
    - name: dh_dia_pagamento
      description: >
        Data de pagamento da bolsa ao bolsista.
    - name: emitente_ug_codigo
      description: >
        Código da Unidade Gestora emitente da OB.
    - name: emitente_ug_nome
      description: >
        Nome da Unidade Gestora emitente da OB.
    - name: bolsista_cpf
      description: >
        Documento (CPF) do bolsista favorecido pelo pagamento.
    - name: bolsista_nome
      description: >
        Nome do bolsista favorecido pelo pagamento.
    - name: oblc_banco_codigo
      description: >
        Código do banco do bolsista.
    - name: oblc_banco_nome
      description: >
        Nome do banco do bolsista.
    - name: oblc_agencia_bancaria_codigo
      description: >
        Código da agência bancária do bolsista.
    - name: oblc_agencia_bancaria_nome
      description: >
        Nome da agência bancária do bolsista.
    - name: oblc_conta_bancaria
      description: >
        Conta bancária do bolsista.
    - name: valor_pago
      description: >
        Valor pago ao bolsista na OB/LC, em R$.
    - name: ob_processo
      description: >
        Número do processo administrativo (SEI) da OB.
    - name: observacao_pagamento
      description: >
        Observação do documento de pagamento (doc_observacao); costuma citar o nome do TED.
    - name: fontes_recurso
      description: >
        Lista das fontes de recurso (códigos) da bolsa vinculadas à OB.
    - name: fonte_recursos_descricao
      description: >
        Descrição (representativa por OB) da fonte de recurso da bolsa.
    - name: ptres_list
      description: >
        Lista de PTRES da bolsa vinculados à OB.
    - name: natureza_codigo
      description: >
        Código da natureza da despesa da bolsa (representativo por OB).
    - name: natureza_descricao
      description: >
        Descrição da natureza da despesa da bolsa (representativa por OB).
    - name: pi_codigo
      description: >
        Código do Plano Interno (PI) da bolsa (representativo por OB).
    - name: pi_descricao
      description: >
        Descrição do Plano Interno (PI) da bolsa (representativa por OB).
    - name: empenhos
      description: >
        Lista das notas de empenho (ne_ccor) da bolsa vinculadas à OB.
    - name: processo_bolsa
      description: >
        Número do processo (SEI) registrado na bolsa paga.
    - name: observacao_bolsa
      description: >
        Observação da bolsa paga; costuma citar o nome do TED.
    - name: num_transferencia
      description: >
        Número de transferência (TED) de origem. Preenchido só quando (fonte, ptres) aponta para um único
        TED; em branco quando não há TED ou quando é ambíguo — ver qtd_transferencia.
    - name: qtd_transferencia
      description: >
        Quantidade de TEDs candidatos para a OB. 0 = sem TED; 1 = único (num_transferencia preenchido);
        >= 2 = ambíguo (num_transferencia em branco; só análise manual resolve).
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) de ingestão do pagamento (pagamentos_ob_bolsa).
    - name: ted_fonte_descricao
      description: >
        Descrição da fonte de recurso na nota de crédito do TED resolvido (ajuda a nomear o TED).
    - name: ted_ug_responsavel
      description: >
        UG responsável pela nota de crédito do TED resolvido.
    - name: ted_objeto
      description: >
        Objeto/finalidade do TED resolvido (do plano detalhado da nota de crédito).
