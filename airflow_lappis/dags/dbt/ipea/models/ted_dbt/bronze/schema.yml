version: 2

models:

  # TED DBT
  - name: pf_tesouro
    description: >
      Esta tabela contém registros de Programações Financeiras extraídas do SIAFI, detalhando informações como tipo de programação, data de execução e valor. 
      A tabela é atualizada diariamente e reflete as autorizações de movimentação financeira no âmbito da execução orçamentária federal.
    meta:
      tags:
        - bronze
    columns:
    - name: emissao_mes
      description: >
        Mês de emissão da Programação Financeira.
    - name: emissao_dia
      description: >
        Dia de emissão da Programação Financeira.
    - name: ug_emitente
      description: >
        Código da Unidade Gestora responsável pela emissão da Programação Financeira.
    - name: ug_emitente_descricao
      description: >
        Nome ou descrição da Unidade Gestora emitente da Programação Financeira.
    - name: ug_favorecido
      description: >
        Código da Unidade Gestora favorecida pela Programação Financeira.
    - name: ug_favorecido_descricao
      description: >
        Nome ou descrição da Unidade Gestora favorecida pela Programação Financeira.
    - name: pf_evento
      description: >
        Código do evento contábil associado à Programação Financeira, representando a natureza da transação.
    - name: pf_evento_descricao
      description: >
        Descrição do evento contábil vinculado à Programação Financeira.
    - name: pf
      description: >
        Número identificador único da Programação Financeira.
    - name: pf_inscricao
      description: >
        Número de inscrição da Programação Financeira, utilizado para controle e acompanhamento.
    - name: pf_acao
      description: >
        Código da ação orçamentária associada à Programação Financeira.
    - name: pf_acao_descricao
      description: >
        Descrição da ação orçamentária vinculada à Programação Financeira.
    - name: pf_fonte_recursos
      description: >
        Código da fonte de recursos associada à Programação Financeira, indicando a origem dos recursos utilizados.
    - name: pf_fonte_recursos_descricao
      description: >
        Descrição textual da fonte de recursos vinculada à Programação Financeira.
    - name: pf_vinculacao_pagamento
      description: >
        Código da vinculação de pagamento associada à Programação Financeira.
    - name: pf_vinculacao_pagamento_descricao
      description: >
        Descrição da vinculação de pagamento vinculada à Programação Financeira.
    - name: pf_categoria_gasto
      description: >
        Código da categoria de gasto associada à Programação Financeira, conforme classificação orçamentária.
    - name: pf_recurso
      description: >
        Código do recurso associado à Programação Financeira.
    - name: pf_recurso_descricao
      description: >
        Descrição do recurso vinculado à Programação Financeira.
    - name: doc_observacao
      description: >
        Observações adicionais relacionadas à Programação Financeira.
    - name: pf_valor_linha
      description: >
        Valor monetário individual da linha da Programação Financeira.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.
    data_tests:
        - verificacao_tipagem:
            nome_tabela: 'ted.pf_tesouro'
            nome_coluna: 'emissao_dia'
            tipo_esperado: 'date'
        - verificacao_tipagem:
            nome_tabela: 'ted.pf_tesouro'
            nome_coluna: 'pf_valor_linha'
            tipo_esperado: 'numeric'

  - name: nc_tesouro
    description: >
      Tabela bronze canônica de Notas de Crédito do SIAFI. Consolida com UNION ALL
      o layout histórico de siafi.nc_tesouro e o layout vigente a partir de 2026
      de siafi.nc_tesouro_pos_2026, preservando os campos usados pelos modelos TED.
    meta:
      tags:
        - bronze
    columns:
    - name: emissao_mes
      description: >
        Mês de emissão da Nota de Crédito.
    - name: emissao_dia
      description: >
        Dia de emissão da Nota de Crédito.
    - name: nc
      description: >
        Número identificador único da Nota de Crédito.
    - name: nc_transferencia
      description: >
        Indicador de que a Nota de Crédito refere-se a uma transferência de recursos entre unidades gestoras.
    - name: nc_fonte_recursos
      description: >
        Código da fonte de recursos associada à Nota de Crédito, indicando a origem dos recursos utilizados.
    - name: nc_fonte_recursos_descricao
      description: >
        Descrição textual da fonte de recursos vinculada à Nota de Crédito.
    - name: ptres
      description: >
        Código do Plano Interno de Trabalho (PTRES) relacionado à Nota de Crédito, utilizado para detalhar a alocação dos recursos.
    - name: nc_evento
      description: >
        Código do evento contábil associado à Nota de Crédito, representando a natureza da transação.
    - name: nc_evento_descr
      description: >
        Descrição do evento contábil; a partir de 2026 recebe o tipo da NC.
    - name: ug_responsavel
      description: >
        Código da Unidade Gestora responsável pela emissão da Nota de Crédito.
    - name: ug_responsavel_descricao
      description: >
        Nome ou descrição da Unidade Gestora responsável pela emissão da Nota de Crédito.
    - name: natureza_despesa
      description: >
        Código da natureza da despesa associada à Nota de Crédito, conforme classificação orçamentária.
    - name: natureza_despesa_detalhada
      description: >
        Descrição detalhada da natureza da despesa vinculada à Nota de Crédito.
    - name: plano_interno
      description: >
        Código do plano interno relacionado à Nota de Crédito, utilizado para controle interno da execução orçamentária.
    - name: plano_detalhado_descricao1
      description: >
        Primeira descrição detalhada do plano interno associado à Nota de Crédito.
    - name: plano_detalhado_descricao2
      description: >
        Segunda descrição detalhada do plano interno associado à Nota de Crédito.
    - name: favorecido_doc
      description: >
        Documento de identificação (CPF ou CNPJ) do favorecido pela Nota de Crédito.
    - name: favorecido_doc_descricao
      description: >
        Nome ou razão social do favorecido identificado na Nota de Crédito.
    - name: nc_valor_linha
      description: >
        Valor monetário individual da linha da Nota de Crédito.
    - name: movimento_liquido
      description: >
        Valor líquido do movimento financeiro associado à Nota de Crédito, após deduções ou acréscimos aplicáveis.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.
    - name: descricao
      description: >
        Descrição da NC disponível somente no layout a partir de 2026.
    - name: nc_item_detalhamento
      description: >
        Indicador de detalhamento do item da NC, disponível a partir de 2026.
    - name: ro
      description: >
        Registro de operação da NC, disponível a partir de 2026.
    - name: dc
      description: >
        Direção do movimento informada no novo relatório (por exemplo, ORIGEM ou DESTINO).
    - name: tipo_nc
      description: >
        Tipo da Nota de Crédito no layout a partir de 2026. Não equivale ao código nc_evento histórico.

  - name: planos_acao
    description: >
      Esta tabela armazena informações detalhadas sobre os Planos de Ação vinculados a programas públicos.
      Ela consolida dados sobre as unidades envolvidas na execução, prazos de vigência, valores, justificativas,
      formas de execução e instrumentos utilizados. Serve como base para o acompanhamento, análise e auditoria 
      da implementação de ações públicas em diferentes formatos de execução.
    meta:
      tags:
        - bronze
    columns:
    - name: id_plano_acao
      description: >
        Identificador único do Plano de Ação.
    - name: id_programa
      description: >
        Identificador único do programa ao qual o Plano de Ação está vinculado.
    - name: sigla_unidade_descentralizada
      description: >
        Sigla da unidade descentralizada responsável pelo Plano de Ação.
    - name: unidade_descentralizada
      description: >
        Nome completo da unidade descentralizada responsável pelo Plano de Ação.
    - name: sigla_unidade_responsavel_execucao
      description: >
        Sigla da unidade responsável pela execução do Plano de Ação.
    - name: unidade_responsavel_execucao
      description: >
        Nome completo da unidade responsável pela execução do Plano de Ação.
    - name: vl_total_plano_acao
      description: >
        Valor total previsto para execução do Plano de Ação.
    - name: dt_inicio_vigencia
      description: >
        Data de início da vigência do Plano de Ação.
    - name: dt_fim_vigencia
      description: >
        Data final da vigência do Plano de Ação.
    - name: tx_objeto_plano_acao
      description: >
        Descrição do objeto do Plano de Ação, informando seu propósito e escopo.
    - name: tx_justificativa_plano_acao
      description: >
        Justificativa para a elaboração e execução do Plano de Ação.
    - name: in_forma_execucao_direta
      description: >
        Indicador booleano que sinaliza se a execução do plano ocorrerá de forma direta.
    - name: in_forma_execucao_particulares
      description: >
        Indicador booleano que sinaliza se a execução contará com a participação de particulares.
    - name: in_forma_execucao_descentralizada
      description: >
        Indicador booleano que sinaliza se a execução será realizada de forma descentralizada.
    - name: tx_situacao_plano_acao
      description: >
        Situação atual do Plano de Ação ( em elaboração, aprovado, em execução, concluído).
    - name: aa_ano_plano_acao
      description: >
        Ano de referência do Plano de Ação.
    - name: vl_beneficiario_especifico
      description: >
        Valor destinado especificamente a beneficiários definidos no Plano de Ação.
    - name: vl_chamamento_publico
      description: >
        Valor previsto para execução por meio de chamamento público.
    - name: sq_instrumento
      description: >
        Código sequencial do instrumento jurídico ou administrativo associado ao Plano de Ação.
    - name: aa_instrumento
      description: >
        Ano de referência do instrumento associado ao Plano de Ação.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.

  - name: bolsas_pagas
    description: >
      Bolsas pagas extraídas do Tesouro Gerencial (SIAFI), detalhando por documento de despesa o credor,
      a fonte de recursos, a natureza da despesa e os valores pagos. Serve de ponte entre os pagamentos
      por bolsista (pagamentos_ob_bolsa) e as notas de crédito (nc_tesouro): a OB que liquidou a despesa
      é registrada em item_informacao e a origem do recurso em fonte_recursos_codigo.
    meta:
      tags:
        - bronze
    columns:
    - name: credor_codigo
      description: >
        Código do credor (CPF/CNPJ) beneficiário da despesa.
    - name: credor_nome
      description: >
        Nome do credor beneficiário da despesa.
    - name: dia_emissao
      description: >
        Data de emissão do documento de despesa.
    - name: mes_emissao
      description: >
        Mês de emissão do documento de despesa, convertido para data (primeiro dia do mês) a partir do
        formato YYYYMM da origem.
    - name: ano_emissao
      description: >
        Ano de emissão do documento de despesa.
    - name: emissao_ano
      description: >
        Ano de emissão (representação numérica) do documento de despesa.
    - name: mes_lancamento
      description: >
        Mês de lançamento contábil da despesa, convertido para data (primeiro dia do mês) a partir do
        formato MMM/YYYY da origem.
    - name: fonte_recursos_codigo
      description: >
        Código da fonte de recursos da despesa. Chave de cruzamento com nc_tesouro.nc_fonte_recursos.
    - name: fonte_recursos_descricao
      description: >
        Descrição da fonte de recursos da despesa.
    - name: pi_codigo
      description: >
        Código do Plano Interno (PI) associado à despesa.
    - name: pi_descricao
      description: >
        Descrição do Plano Interno (PI) associado à despesa.
    - name: ptres
      description: >
        Código do Programa de Trabalho Resumido (PTRES) da despesa, sem o sufixo decimal de ingestão.
        Junto da fonte de recursos, é a chave de cruzamento com nc_tesouro.
    - name: natureza_codigo
      description: >
        Código da natureza da despesa, sem o sufixo decimal de ingestão.
    - name: natureza_descricao
      description: >
        Descrição da natureza da despesa.
    - name: processo
      description: >
        Número do processo administrativo da despesa.
    - name: valor
      description: >
        Valor registrado da despesa, em R$.
    - name: observacao
      description: >
        Observações do documento de despesa.
    - name: ne_ccor
      description: >
        Nota de empenho / célula de crédito orçamentário associada à despesa.
    - name: documento_habil
      description: >
        Documento hábil que originou o pagamento.
    - name: item_informacao
      description: >
        Ordem Bancária (OB) que liquidou a despesa. Chave de cruzamento com pagamentos_ob_bolsa.ob.
    - name: despesa_paga
      description: >
        Valor de despesa efetivamente paga, em R$.
    - name: rp_processados
      description: >
        Valor de Restos a Pagar processados, em R$.
    - name: rp_nao_processados
      description: >
        Valor de Restos a Pagar não processados, em R$.
    - name: pagamentos_totais
      description: >
        Valor total de pagamentos, em R$.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.
    data_tests:
        - verificacao_tipagem:
            nome_tabela: 'ted.bolsas_pagas'
            nome_coluna: 'dia_emissao'
            tipo_esperado: 'date'
        - verificacao_tipagem:
            nome_tabela: 'ted.bolsas_pagas'
            nome_coluna: 'mes_emissao'
            tipo_esperado: 'date'
        - verificacao_tipagem:
            nome_tabela: 'ted.bolsas_pagas'
            nome_coluna: 'valor'
            tipo_esperado: 'numeric'

  - name: pagamentos_ob_bolsa
    description: >
      Pagamentos de bolsas detalhados por Ordem Bancária (OB) e credor, extraídos do Tesouro Gerencial
      (SIAFI). Cada linha corresponde a um bolsista pago dentro de uma OB, com favorecido, dados bancários
      e valor. É o grão de bolsista usado para chegar, via bolsas_pagas e nc_tesouro, ao TED de origem.
    meta:
      tags:
        - bronze
    columns:
    - name: dh_mes_emissao
      description: >
        Mês de emissão do documento hábil.
    - name: dh_dia_emissao
      description: >
        Data de emissão do documento hábil.
    - name: dh_dia_pagamento
      description: >
        Data de pagamento do documento hábil.
    - name: emitente_ug_codigo
      description: >
        Código da Unidade Gestora emitente da OB.
    - name: emitente_ug_nome
      description: >
        Nome da Unidade Gestora emitente da OB.
    - name: ob
      description: >
        Número da Ordem Bancária (OB). Chave de cruzamento com bolsas_pagas.item_informacao.
    - name: ob_lista_credores
      description: >
        Número da Lista de Credores (LC) associada à OB.
    - name: oblc_favorecido_numero
      description: >
        Documento (CPF/CNPJ) do favorecido/bolsista pago na OB/LC.
    - name: oblc_favorecido_nome
      description: >
        Nome do favorecido/bolsista pago na OB/LC.
    - name: oblc_banco_codigo
      description: >
        Código do banco do favorecido.
    - name: oblc_banco_nome
      description: >
        Nome do banco do favorecido.
    - name: oblc_agencia_bancaria_codigo
      description: >
        Código da agência bancária do favorecido.
    - name: oblc_agencia_bancaria_nome
      description: >
        Nome da agência bancária do favorecido.
    - name: oblc_conta_bancaria
      description: >
        Conta bancária do favorecido.
    - name: oblc_valor
      description: >
        Valor pago ao favorecido/bolsista na OB/LC, em R$.
    - name: oblc_sequencial
      description: >
        Sequencial do credor dentro da OB/LC.
    - name: ob_processo
      description: >
        Número do processo administrativo associado à OB.
    - name: documento_habil
      description: >
        Documento hábil que originou a OB.
    - name: doc_observacao
      description: >
        Observação do documento hábil (descrição do pagamento da bolsa).
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.
    data_tests:
        - verificacao_tipagem:
            nome_tabela: 'ted.pagamentos_ob_bolsa'
            nome_coluna: 'dh_dia_pagamento'
            tipo_esperado: 'date'
        - verificacao_tipagem:
            nome_tabela: 'ted.pagamentos_ob_bolsa'
            nome_coluna: 'oblc_valor'
            tipo_esperado: 'numeric'

  - name: planos_acao_meta
    description: >
      Metas dos Planos de Ação de TED, obtidas do endpoint plano_acao_meta da API de TED
      do Transferegov. Cada meta pertence a um Plano de Ação e detalha quantidade, unidade,
      valor unitário e vigência do produto a ser entregue.
    meta:
      tags:
        - bronze
    columns:
    - name: id_meta
      description: >
        Identificador único da meta.
      tests:
        - unique
        - not_null
    - name: id_plano_acao
      description: >
        Identificador do Plano de Ação ao qual a meta pertence.
      tests:
        - not_null
    - name: nr_meta
      description: >
        Número sequencial da meta dentro do Plano de Ação.
    - name: no_meta
      description: >
        Nome da meta.
    - name: ds_meta
      description: >
        Descrição da meta.
    - name: ds_unidade
      description: >
        Unidade de medida da meta.
    - name: qt_meta
      description: >
        Quantidade prevista para a meta.
    - name: vl_unitario
      description: >
        Valor unitário previsto para a meta.
    - name: dt_inicio
      description: >
        Data de início da vigência da meta.
    - name: dt_fim
      description: >
        Data de fim da vigência da meta.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.
    tests:
        - verificacao_tipagem:
            nome_tabela: 'ted.planos_acao_meta'
            nome_coluna: 'dt_inicio'
            tipo_esperado: 'date'
        - verificacao_tipagem:
            nome_tabela: 'ted.planos_acao_meta'
            nome_coluna: 'vl_unitario'
            tipo_esperado: 'numeric'

  - name: planos_acao_etapa
    description: >
      Etapas das metas dos Planos de Ação de TED, obtidas do endpoint plano_acao_etapa da
      API de TED do Transferegov. Cada etapa pertence a uma meta.
    meta:
      tags:
        - bronze
    columns:
    - name: id_etapa
      description: >
        Identificador único da etapa.
      tests:
        - unique
        - not_null
    - name: id_meta
      description: >
        Identificador da meta à qual a etapa pertence.
      tests:
        - not_null
        - relationships:
            to: ref('planos_acao_meta')
            field: id_meta
    - name: nr_etapa
      description: >
        Número sequencial da etapa dentro da meta.
    - name: no_etapa
      description: >
        Nome da etapa.
    - name: ds_etapa
      description: >
        Descrição da etapa.
    - name: ds_unidade
      description: >
        Unidade de medida da etapa.
    - name: qt_etapa
      description: >
        Quantidade prevista para a etapa.
    - name: vl_unitario
      description: >
        Valor unitário previsto para a etapa.
    - name: dt_inicio
      description: >
        Data de início da vigência da etapa.
    - name: dt_fim
      description: >
        Data de fim da vigência da etapa.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.
    tests:
        - verificacao_tipagem:
            nome_tabela: 'ted.planos_acao_etapa'
            nome_coluna: 'dt_inicio'
            tipo_esperado: 'date'
        - verificacao_tipagem:
            nome_tabela: 'ted.planos_acao_etapa'
            nome_coluna: 'vl_unitario'
            tipo_esperado: 'numeric'

  - name: termos_execucao
    description: >
      Termos de Execução Descentralizada dos Planos de Ação, obtidos do endpoint
      termo_execucao da API de TED do Transferegov. Traz o processo SEI e as datas de
      assinatura, divulgação, recebimento e efetivação do termo.
    meta:
      tags:
        - bronze
    columns:
    - name: id_termo
      description: >
        Identificador único do termo de execução.
      tests:
        - unique
        - not_null
    - name: id_plano_acao
      description: >
        Identificador do Plano de Ação ao qual o termo pertence.
      tests:
        - not_null
    - name: ds_situacao
      description: >
        Situação do termo de execução.
    - name: nr_processo_sei
      description: >
        Número do processo SEI do termo de execução.
    - name: dt_assinatura
      description: >
        Data de assinatura do termo.
    - name: dt_divulgacao
      description: >
        Data de divulgação do termo.
    - name: in_minuta_padrao
      description: >
        Indica se o termo usa a minuta padrão.
    - name: nr_ns
      description: >
        Número da Nota de Sistema (NS) do termo.
    - name: dt_recebimento
      description: >
        Data de recebimento do termo.
    - name: dt_efetivacao
      description: >
        Data de efetivação do termo.
    - name: dt_ingest
      description: >
        Data e hora (UTC-3 Brasília) em que os dados foram ingeridos da fonte original para a camada raw.
    tests:
        - verificacao_tipagem:
            nome_tabela: 'ted.termos_execucao'
            nome_coluna: 'dt_assinatura'
            tipo_esperado: 'date'
        - verificacao_tipagem:
            nome_tabela: 'ted.termos_execucao'
            nome_coluna: 'in_minuta_padrao'
            tipo_esperado: 'boolean'

  - name: planos_acao_analise
    description: >
      Análises dos Planos de Ação de TED, obtidas do endpoint plano_acao_analise da API
      de TED do Transferegov.
    meta:
      tags:
        - bronze
    columns:
    - name: id_analise
      description: >
        Identificador único da análise.
      tests:
        - unique
        - not_null
    - name: id_plano_acao
      description: >
        Identificador do Plano de Ação analisado.
