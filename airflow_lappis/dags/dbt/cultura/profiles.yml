cultura:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DB_DW_HOST_CULTURA', 'postgres') }}"
      user: "{{ env_var('DB_DW_USER_CULTURA', 'postgres_dw') }}"
      password: "{{ env_var('DB_DW_PASSWORD_CULTURA', 'postgres_dw') }}"
      port: "{{ env_var('DB_DW_PORT_CULTURA', '5432') | int }}"
      dbname: "{{ env_var('DB_DW_DBNAME_CULTURA', 'data_warehouse') }}"
      schema: "{{ env_var('DB_DW_SCHEMA_CULTURA', 'cultura') }}"
      threads: 4
