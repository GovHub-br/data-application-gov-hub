version: 2

models:
  - name: lpg_agentes_pf
    description: >
      Camada Bronze — dados brutos de pessoas físicas da LPG (Lei Paulo Gustavo).
      Mapeia o CPF como identificador único e traz a coluna bruta de histórico
      de acesso a recursos públicos de fomento à cultura.
    config:
      meta:
        tags:
          - bronze
          - agentes
          - pessoa_fisica
          - lpg
    columns:
      - name: identificador_unico
        description: CPF do proponente pessoa física, normalizado para lowercase.
        tests:
          - not_null
      - name: historico_acesso_bruto
        description: Resposta bruta da LPG sobre acesso anterior a recursos públicos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — sempre 'LPG' neste modelo.

  - name: lpg_agentes_pj
